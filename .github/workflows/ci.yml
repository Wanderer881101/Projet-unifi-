name: Public Runtime CI

on:
  push:
    branches: [main, "agent/**", "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test tools
        run: python -m pip install --upgrade pip pytest && python -m pip install -e .
      - name: Validate repository contract
        run: python scripts/validate_structure.py
      - name: Compile package
        run: python -m compileall -q src tests scripts
      - name: Run tests
        run: python -m pytest
      - name: CLI smoke test
        run: |
          projet-unifi health
          projet-unifi capabilities
          projet-unifi invoke core.echo --args '{"value":"ci"}'

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build wheel and source distribution
        run: python -m pip install --upgrade build && python -m build
      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: projet-unifi-package
          path: dist/
