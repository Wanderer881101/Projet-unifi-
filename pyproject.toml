[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "projet-unifi"
version = "2.0.0a1"
description = "Modular, policy-driven runtime for the Projet Unifie / Nexus ecosystem"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Jonathan Therrien"}]
license = {text = "Proprietary - All rights reserved"}
keywords = ["nexus", "runtime", "orchestration", "polymorphic", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]

[project.scripts]
projet-unifi = "projet_unifi.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
